name: Collect updates and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: elsewhere-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check application and collector
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect public sources
        run: python scripts/collect.py
      - name: Build static site
        run: npm run build
      - name: Keep the collection for the next run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public source collection'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
